    <rect x="0" y="420" width="6" height="8"/><rect x="54" y="420" width="6" height="8"/><rect x="18" y="440" width="6" height="8"/>
    <rect x="120" y="345" width="6" height="8"/><rect x="140" y="365" width="6" height="8"/><rect x="160" y="345" width="6" height="8"/>
    <rect x="120" y="400" width="6" height="8"/><rect x="160" y="420" width="6" height="8"/>
    <rect x="215" y="430" width="6" height="8"/><rect x="240" y="450" width="6" height="8"/><rect x="265" y="430" width="6" height="8"/>
    <rect x="215" y="480" width="6" height="8"/><rect x="290" y="470" width="6" height="8"/>
    <rect x="410" y="390" width="6" height="8"/><rect x="440" y="410" width="6" height="8"/><rect x="470" y="390" width="6" height="8"/>
    <rect x="410" y="440" width="6" height="8"/><rect x="500" y="430" width="6" height="8"/><rect x="530" y="450" width="6" height="8"/>
    <rect x="565" y="360" width="6" height="8"/><rect x="590" y="380" width="6" height="8"/><rect x="610" y="360" width="6" height="8"/>
    <rect x="565" y="410" width="6" height="8"/><rect x="610" y="430" width="6" height="8"/>
    <rect x="645" y="420" width="6" height="8"/><rect x="670" y="440" width="6" height="8"/><rect x="700" y="420" width="6" height="8"/>
    <rect x="645" y="470" width="6" height="8"/><rect x="725" y="460" width="6" height="8"/>
    <rect x="775" y="340" width="6" height="8"/><rect x="800" y="360" width="6" height="8"/><rect x="825" y="340" width="6" height="8"/>
    <rect x="775" y="390" width="6" height="8"/><rect x="850" y="380" width="6" height="8"/>
  </g>
  <g fill="#4fd6e6" opacity="0.6" transform="translate(0,260)">
    <rect x="200" y="450" width="6" height="8"/><rect x="320" y="460" width="6" height="8"/>
    <rect x="420" y="470" width="6" height="8"/><rect x="700" y="470" width="6" height="8"/>
  </g>

  <!-- road -->
  <g transform="translate(0,720)">
    <polygon points="360,0 520,0 880,460 0,460" fill="#12151d"/>
    <polygon points="392,0 488,0 700,460 180,460" fill="#1c202b"/>
    <polygon points="432,0 448,0 460,460 420,460" fill="#f5c945" opacity="0.9"/>
  </g>

  <!-- car -->
  <g transform="translate(0,900)">
    <polygon points="300,300 580,300 500,130 380,130" fill="#7a1414"/>
    <polygon points="300,300 580,300 545,220 335,220" fill="#c22323"/>
    <polygon points="380,130 500,130 470,60 410,60" fill="#901c1c"/>
