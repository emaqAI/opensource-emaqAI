    <rect x="110" y="320" width="90" height="300"/>
    <rect x="195" y="400" width="150" height="220"/>
    <rect x="335" y="300" width="70" height="320"/>
    <rect x="395" y="360" width="160" height="260"/>
    <rect x="545" y="330" width="90" height="290"/>
    <rect x="625" y="390" width="140" height="230"/>
    <rect x="755" y="310" width="130" height="310"/>
