<svg width="880" height="1180" viewBox="0 0 880 1180" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0f1e"/>
      <stop offset="28%" stop-color="#0d1220"/>
      <stop offset="62%" stop-color="#120a16"/>
      <stop offset="100%" stop-color="#05060a"/>
    </linearGradient>
    <radialGradient id="moon" cx="38%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#ffe7c2"/>
      <stop offset="42%" stop-color="#ff8f6b"/>
      <stop offset="72%" stop-color="#ff6f61" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moonhalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff785a" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ff785a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="psbadge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff5d4e"/>
      <stop offset="100%" stop-color="#ff8f6b"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#ffffff" opacity="0.035"/>
    </pattern>
    <filter id="soft"><feGaussianBlur stdDeviation="1"/></filter>
  </defs>

  <rect width="880" height="1180" fill="url(#bg)"/>

  <!-- moon glow -->
  <circle cx="730" cy="290" r="170" fill="url(#moonhalo)"/>
  <circle cx="745" cy="197" r="105" fill="url(#moon)" filter="url(#soft)"/>

  <!-- far skyline -->
  <g fill="#161c30" transform="translate(0,260)">
    <rect x="-10" y="260" width="90" height="360"/>
    <rect x="70" y="220" width="60" height="400"/>
    <rect x="120" y="280" width="110" height="340"/>
    <rect x="215" y="180" width="70" height="440"/>
    <rect x="270" y="250" width="90" height="370"/>
    <rect x="350" y="150" width="60" height="470"/>
    <rect x="400" y="230" width="130" height="390"/>
    <rect x="520" y="190" width="80" height="430"/>
    <rect x="590" y="260" width="100" height="360"/>
    <rect x="680" y="170" width="65" height="450"/>
    <rect x="735" y="240" width="95" height="380"/>
    <rect x="820" y="200" width="70" height="420"/>
  </g>

  <!-- near skyline -->
