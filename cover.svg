  <!-- eyebrow -->
  <text x="440" y="70" text-anchor="middle" font-size="15" letter-spacing="10" font-weight="700" fill="#ff8f6b">EMAQ AI OPEN SOURCE</text>

  <!-- title -->
  <text x="440" y="440" text-anchor="middle" font-size="118" font-weight="900" letter-spacing="6" font-family="Impact, 'Arial Black', sans-serif" fill="#f6f4ee">CHROME</text>
  <text x="440" y="560" text-anchor="middle" font-size="118" font-weight="900" letter-spacing="6" font-family="Impact, 'Arial Black', sans-serif" fill="#ff5d4e">CITY</text>

  <!-- tagline -->
  <rect x="152" y="630" width="576" height="42" fill="#05060a" opacity="0.55"/>
  <line x1="152" y1="630" x2="728" y2="630" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
  <line x1="152" y1="672" x2="728" y2="672" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
  <text x="440" y="657" text-anchor="middle" font-size="17" letter-spacing="4" fill="#cfd6e6">JEDEN KURS. JEDNO MIASTO. ZERO LITO&#346;CI.</text>

  <!-- bottom bar -->
  <rect x="0" y="1084" width="880" height="96" fill="#05060a"/>
  <line x1="0" y1="1084" x2="880" y2="1084" stroke="#262c3d" stroke-width="2"/>
  <rect x="44" y="1113" width="46" height="46" rx="10" fill="url(#psbadge)"/>
  <text x="67" y="1143" text-anchor="middle" font-size="20" font-weight="900" fill="#1a0805">PS</text>
  <text x="106" y="1129" font-size="13" letter-spacing="2" fill="#8b93a7">HOMEBREW</text>
  <text x="106" y="1146" font-size="13" letter-spacing="2" fill="#8b93a7">PLAYSTATION&#174; ONE</text>
  <text x="836" y="1129" text-anchor="end" font-size="13" letter-spacing="3" fill="#8b93a7">GTE ENGINE &#183; OPEN SOURCE</text>
  <text x="836" y="1146" text-anchor="end" font-size="13" letter-spacing="3" fill="#8b93a7">emaqai/opensource-emaqai</text>

  <!-- scanlines -->
  <rect width="880" height="1180" fill="url(#scan)" style="mix-blend-mode:overlay"/>
</svg>
